<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2732 2732" width="2732" height="2732"><defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="95%">
      <stop offset="0" stop-color="#22307F"/>
      <stop offset=".55" stop-color="#121A46"/>
      <stop offset="1" stop-color="#0A0F2C"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38D6F5"/>
