<template>
  <style>
    @font-face { font-family: "RC"; src: url("assets/fonts/RobotoCondensed-VF.ttf") format("truetype"); font-weight: 100 900; }

  <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">

      <div id="s1-kb" class="kb" data-layout-allow-overflow><img id="s1-img" src="assets/img/01.png" alt="Гриша на улице Казани" /></div>
      <div id="s1-snow" class="layer" data-layout-ignore></div>

    <div id="s1-cap1" class="clip layer" data-start="0.15" data-duration="4.55" style="z-index: 20">
      <div id="s1-cap1-box" class="cap" style="left: 120px; top: 110px">Ты — Гриша Хрипунов.</div>
    </div>
    <div id="s1-cap2" class="clip layer" data-start="2.16" data-duration="2.54" style="z-index: 21">

  <script>
    const tl = gsap.timeline({ paused: true });
    // panel wipes in left-to-right like ink being laid down
    tl.fromTo("#s1-panel", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "expo.out" }, 0);
    // slow camera drift toward Grisha, eased both ways
    tl.fromTo("#s1-kb", { scale: 1.14, x: -40, y: 10 }, { scale: 1.0, x: 30, y: 0, duration: 4.7, ease: "power2.inOut" }, 0);
    // caption boxes pop with a cartoon-ish spring, then hold dead still
    tl.fromTo("#s1-cap1-box", { scale: 0.55, rotation: -7, opacity: 0 }, { scale: 1, rotation: -2.5, opacity: 1, duration: 0.32, ease: "back.out(2)" }, 0.15);
    tl.fromTo("#s1-cap2-box", { scale: 0.55, rotation: 6, opacity: 0 }, { scale: 1, rotation: 1.5, opacity: 1, duration: 0.32, ease: "back.out(2)" }, 2.16);
    // seeded snow: each flake falls once across the scene
    let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const snow = document.querySelector("#s1-snow");
    for (let i = 0; i < 80; i++) {
      const f = document.createElement("div"); f.className = "flake";
      const s = 3 + rnd() * 6; f.style.width = f.style.height = s + "px"; f.style.left = rnd() * 1800 + "px"; f.style.top = "0px";

      const y0 = -60 - rnd() * 900, dy = 900 + rnd() * 500;
      tl.fromTo(f, { y: y0, x: 0 }, { y: y0 + dy, x: 40 + rnd() * 60, duration: 4.7, ease: "none" }, 0);
    }
    window.__timelines["s1"] = tl;
