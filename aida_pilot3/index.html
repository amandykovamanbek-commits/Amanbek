    <style>
      :root {
        --ground: #e6d9bd;
        --ink: #111111;
        --accent: #f2cf3c;
        --blood: #e53228;
      }

        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
