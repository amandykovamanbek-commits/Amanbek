name: BILIM QADAM APK

on:
  push:
    paths:
      - 'bilim-qadam-app/**'
      - 'bilim-qadam/public/**'
      - '.github/workflows/bilim-qadam-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilim-qadam-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bilim-qadam-app
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy the web app into www/
        run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: Generate icons and splash screen
        run: npm run assets

      - name: Set version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK (signed release)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew assembleRelease --no-daemon && cd ..
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out BILIM-QADAM.apk aligned.apk
          "$BT/apksigner" verify BILIM-QADAM.apk
          rm -f release.keystore aligned.apk

      - name: Build APK (debug-signed)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          cd android && ./gradlew assembleDebug --no-daemon && cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk BILIM-QADAM.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BILIM-QADAM-apk
          path: bilim-qadam-app/BILIM-QADAM.apk

      - name: Publish to the bilim-qadam-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la BILIM-QADAM.apk
          gh release delete bilim-qadam-apk --cleanup-tag -y || true
          gh release create bilim-qadam-apk BILIM-QADAM.apk \
            --target "${{ github.sha }}" \
            --title "BILIM QADAM · Android 1.0.${{ github.run_number }}" \
            --notes "Android қосымшасы. Орнату: APK файлын жүктеп ашыңыз, «Белгісіз көздерден орнатуға» рұқсат беріңіз."
