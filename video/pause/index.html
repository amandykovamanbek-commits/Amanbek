<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пауза на 10 секунд</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Unbounded,Inter,sans-serif;transform-origin:0 0}
  .L{position:absolute;left:0;top:0;width:1080px;height:1920px}
  .L>svg,.L>canvas{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
  #ins{opacity:0}
  #ripple{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;border:10px solid #7ff6ff;opacity:0;box-shadow:0 0 40px #7ff6ff,inset 0 0 40px #7ff6ff;transform-origin:50% 50%}
  #ripple2{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;border:4px solid #fff;opacity:0}
  #vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,.45) 100%);pointer-events:none}
  #pvig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(20,60,110,0) 40%,rgba(10,30,70,.55) 100%);opacity:0}
  #flash{position:absolute;inset:0;background:#fff;opacity:0}
  #glare{position:absolute;inset:0;opacity:0;mix-blend-mode:screen}
  #cap{position:absolute;left:30px;right:30px;top:1585px;text-align:center;font-weight:900;font-size:70px;line-height:1.14;color:#fff;
       -webkit-text-stroke:14px #0b0f1a;paint-order:stroke fill;text-transform:uppercase;letter-spacing:-1px}
  #cap span{display:inline-block;margin:0 15px;transform-origin:50% 70%}
  .kt{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;color:#fff;white-space:nowrap;-webkit-text-stroke:16px #0b0f1a;paint-order:stroke fill;opacity:0}
  .kt span{display:inline-block;transform-origin:50% 60%}
  #hud{position:absolute;left:36px;top:52px;display:flex;align-items:center;gap:14px;background:rgba(11,15,26,.82);border-radius:46px;padding:12px 28px 12px 14px;opacity:0;box-shadow:0 10px 30px rgba(0,0,0,.35);border:3px solid rgba(127,246,255,.35)}
  #hud .lb{font-family:Rubik,Inter,sans-serif;font-weight:800;font-size:22px;letter-spacing:2px;color:#9fb2c8}
  #hud .v{font-weight:900;font-size:50px;color:#7ff6ff;line-height:1}
  #day{position:absolute;right:36px;top:62px;background:#fff;color:#0b0f1a;border-radius:40px;padding:12px 26px;font-weight:900;font-size:30px;opacity:0;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  #ring{position:absolute;left:390px;top:250px;width:300px;height:300px;opacity:0}
  #cta{position:absolute;left:90px;width:900px;top:1440px;text-align:center;opacity:0}
  #cta span{display:inline-block;background:#7ff6ff;color:#0b0f1a;font-weight:900;font-size:50px;line-height:1.2;padding:24px 40px;border-radius:40px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="mb0" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb5" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb7" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mb8" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>
    <filter id="mbI" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0 0"/></filter>

</svg>
<div id="stage">
  <div class="L" id="L0"><svg viewBox="0 0 1080 1920"><g id="c0"></g></svg></div>
  <div class="L" id="L1"><svg viewBox="0 0 1080 1920"><g id="c1"></g></svg></div>
  <div class="L" id="L2"><svg viewBox="0 0 1080 1920"><g id="c2"></g></svg></div>
  <div class="L" id="L3"><svg viewBox="0 0 1080 1920"><g id="c3"></g></svg></div>
  <div class="L" id="L4"><canvas id="rainB" width="1080" height="1920"></canvas></div>
  <div class="L" id="L5"><svg viewBox="0 0 1080 1920"><g id="c5"></g></svg></div>
  <div class="L" id="L6"><svg viewBox="0 0 1080 1920"><g id="c6"></g></svg></div>
  <div class="L" id="L7"><svg viewBox="0 0 1080 1920"><g id="c7"></g></svg></div>
  <div class="L" id="L8"><canvas id="rainF" width="1080" height="1920"></canvas></div>
  <div id="glare"></div>
  <div id="pvig"></div>
  <div class="L" id="ins"><svg viewBox="0 0 1080 1920"><g id="ci"></g></svg></div>
  <div id="ripple"></div><div id="ripple2"></div>
  <div id="vign"></div>
  <div id="kts"></div>
  <svg id="ring" viewBox="0 0 300 300"></svg>
  <div id="hud"><svg width="66" height="66" viewBox="0 0 66 66"><circle cx="33" cy="33" r="29" fill="#13203a" stroke="#c9ccd4" stroke-width="5"/><circle id="hudArc" cx="33" cy="33" r="20" fill="none" stroke="#7ff6ff" stroke-width="6" stroke-dasharray="125.7" stroke-dashoffset="0" transform="rotate(-90 33 33)"/><circle cx="33" cy="33" r="5" fill="#7ff6ff"/></svg>
    <div><div class="lb">ПАУЗА</div><div class="v" id="hudV">×1</div></div></div>
  <div id="day">ДЕНЬ 1</div>
  <div id="cap"></div>
  <div id="cta"><span>А ТЫ НА ЧТО<br>ПОТРАТИЛ БЫ?</span><br><span style="margin-top:18px;background:#ffd166;font-size:40px">ПИШИ В КОММЕНТАХ ↓</span></div>
  <div id="flash"></div>
</div>

<script src="data/words.js"></script>
<script>
// ================================================================= utils
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeIn = k => Math.pow(clamp(k), 3);
const easeInOut = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const smooth = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const easeOutBack = k => { k = clamp(k); const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const spring = (k, f = 3.2, d = 5) => { if (k <= 0) return 0; return 1 - Math.exp(-d * k) * Math.cos(f * Math.PI * k); };
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, fi = .2, fo = .2) => Math.min(smooth((t - a) / fi), smooth((b - t) / fo));
const decay = (t, t0, rate = 6) => t < t0 ? 0 : Math.exp(-(t - t0) * rate);
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const noise = (t, f, ph = 0) => Math.sin(t * f + ph) * .6 + Math.sin(t * f * 2.31 + ph * 1.7) * .4;
const DEG = Math.PI / 180;
function setA(id, k, v) { const e = typeof id === 'string' ? $(id) : id; if (e) e.setAttribute(k, v); }
function tr(id, x, y, s = 1, r = 0, sy) { setA(id, 'transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(4)} ${(sy ?? s).toFixed(4)})`); }
function op(id, v) { setA(id, 'opacity', clamp(v).toFixed(3)); }
function disp(id, on) { setA(id, 'display', on ? 'inline' : 'none'); }

// ================================================================= script
const SCENES = [
  { id: 's1', bg: 'city', text: 'Что если раз в день ты мог поставить весь мир на паузу? Ровно на десять секунд.' },
  { id: 's2', bg: 'kitchen', text: 'Первый раз это случается случайно. Ты жмёшь кнопку на старых дедушкиных часах… и кружка зависает в воздухе. Вместе с каплями чая и котом в прыжке.' },
  { id: 's3', bg: 'kitchen', text: 'Правила простые. Десять секунд. Один раз в сутки. Двигаешься только ты — и то, что держишь в руках.' },
  { id: 's4', bg: 'bus', text: 'Первую неделю ты творишь что хочешь. Запрыгиваешь в закрывшийся автобус.' },
  { id: 's5', bg: 'class', text: 'Подсматриваешь ответ у отличника.' },
  { id: 's6', bg: 'yard', text: 'Ловишь мяч в сантиметре от лица.' },
  { id: 's7', bg: 'city', text: 'Но пауза — одна. Потратил утром на автобус — и весь день ты обычный человек.' },
  { id: 's8', bg: 'yard', text: 'Уронил бутерброд — и смотришь, как он падает маслом вниз.' },
  { id: 's9', bg: 'bed', text: 'Поэтому ты начинаешь её беречь. На всякий случай. И каждую ночь, ровно в двенадцать, пауза сгорает — неиспользованная. Одна ночь. Вторая. Седьмая.' },
  { id: 's10', bg: 'cross', text: 'А потом этот случай наступает. Вечер. Дождь. На дорогу выкатывается мяч. Девочка бежит за ним. И фары.' },
  { id: 's11', bg: 'cross', text: 'Щелчок. Тишина. Капли висят в воздухе. Ты бежишь. Берёшь её на руки — и на секунду она тоже в паузе. Смотрит на тебя и не понимает, почему дождь стоит. Три… два… один.' },
  { id: 's12', bg: 'cross', text: 'Визг тормозов. Машина проносится по пустой зебре. Девочка стоит на тротуаре — с мячом в руках.' },
  { id: 's13', bg: 'cross', text: 'А ты смотришь на часы. Ноль пауз. И это лучший день за всю неделю.' },
  { id: 's14', bg: 'cross', text: 'Иногда десять секунд — это целая жизнь. А на что потратил бы свои ты? Пиши в комментах.' },
];
const norm = w => w.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]/g, '');
const TOK = [];
SCENES.forEach((sc, si) => {
  sc.tokens = [];
  sc.text.split(/\s+/).forEach(w => {
    if (!norm(w)) { if (w.trim() === '—' && sc.tokens.length) sc.tokens[sc.tokens.length - 1].w += ' —'; return; }
    const tk = { w, n: norm(w), si };
    sc.tokens.push(tk); TOK.push(tk);
  });
});
(function applyTimings() {
  const Wd = window.WORDS;
  if (Wd && Wd.length === TOK.length) { TOK.forEach((tk, i) => { tk.s = Wd[i].s; tk.e = Wd[i].e; }); window.PLACEHOLDER = false; return; }
  window.PLACEHOLDER = true;
  let t = 0.4;
  TOK.forEach((tk, i) => {
    const d = 0.042 * tk.n.length + 0.07;
    tk.s = t; tk.e = t + d; t += d + 0.03;
    if (/[.!?…]$/.test(tk.w)) t += 0.32; else if (/[,:—]$/.test(tk.w)) t += 0.12;
    const nx = TOK[i + 1]; if (nx && nx.si !== tk.si) t += 0.25;
  });
})();
const VO_END = TOK[TOK.length - 1].e;
const DURATION = VO_END + 3.2;
SCENES.forEach((sc, i) => { sc.start = i === 0 ? 0 : sc.tokens[0].s - 0.18; });
SCENES.forEach((sc, i) => { sc.end = i < SCENES.length - 1 ? SCENES[i + 1].start : DURATION; });
const SC = {}; SCENES.forEach(s => SC[s.id] = s);
function W(sid, pre, nth = 0, edge = 's') {
  const sc = SC[sid]; const p = norm(pre);
  let hits = sc.tokens.filter(t => t.n === p);
  if (!hits.length) hits = sc.tokens.filter(t => t.n.startsWith(p));
  if (!hits.length) throw new Error('cue not found ' + sid + ' ' + pre);
  return hits[Math.min(nth, hits.length - 1)][edge];
}
const E = (sid, pre, nth = 0) => W(sid, pre, nth, 'e');

// ---------------------------------------------------------------- captions
const ACCENT = new Set(['паузу', 'пауза', 'десять', 'секунд', 'один', 'только', 'руках', 'хочешь', 'одна', 'обычный', 'маслом', 'беречь', 'сгорает', 'седьмая', 'фары', 'тишина', 'три', 'два', 'бежишь', 'жизнь', 'комментах', 'ноль', 'лучший', 'кнопку', 'зависает', 'случай']);
const NOCAP = [];   // [a,b] ranges where big kinetic type replaces captions
const CHUNKS = [];
(function () {
  let cur = [];
  const flush = () => { if (cur.length) CHUNKS.push(cur); cur = []; };
  TOK.forEach((tk, i) => {
    const prev = TOK[i - 1];
    if (cur.length && prev.si !== tk.si) flush();
    cur.push(tk);
    const len = cur.reduce((a, t) => a + t.w.length + 1, 0);
    if (/[.!?…:]$/.test(tk.w) || (/[,—]$/.test(tk.w) && cur.length >= 2) || cur.length >= 3 || len > 16) flush();
  });
  flush();
  CHUNKS.forEach((c, i) => { c.s = c[0].s - 0.06; c.e = i < CHUNKS.length - 1 ? Math.min(CHUNKS[i + 1][0].s - 0.06, c[c.length - 1].e + 0.9) : c[c.length - 1].e + 0.8; });
})();

// ================================================================= time model: pauses, slow motion, world time
const PAUSES = [], SLOW = [];
function buildTime() {
  PAUSES.push([W('s1', 'паузу') + 0.05, SC.s2.start]);
  PAUSES.push([W('s2', 'кнопку') + 0.12, E('s3', 'руках') + 0.35]);
  PAUSES.push([W('s4', 'запрыгиваешь') + 0.05, E('s4', 'автобус') + 0.1]);
  PAUSES.push([W('s5', 'подсматриваешь') + 0.05, E('s5', 'отличника') + 0.05]);
  PAUSES.push([W('s6', 'мяч') - 0.05, E('s6', 'лица') + 0.12]);
  PAUSES.push([W('s11', 'щелчок') + 0.38, SC.s12.start + 0.05]);
  SLOW.push([W('s2', 'случается') + 0.1, W('s2', 'кнопку') + 0.12, 0.18]);
  SLOW.push([W('s8', 'уронил') + 0.25, E('s8', 'вниз') - 0.05, 0.16]);
}
buildTime();
function Pz(t) { // freeze amount (motion)
  let v = 0;
  for (const [a, b] of PAUSES) { if (t >= a && t < b + 0.3) v = Math.max(v, Math.min(clamp((t - a) / 0.09), 1 - clamp((t - b) / 0.3))); }
  return v;
}
function Pc(t) { // colour drain amount
  let v = 0;
  for (const [a, b] of PAUSES) { if (t >= a && t < b + 0.25) v = Math.max(v, Math.min(smooth((t - a) / 0.45), 1 - smooth((t - b) / 0.22))); }
  return v;
}
function TS(t) {
  let s = 1;
  for (const [a, b, f] of SLOW) { if (t > a - 0.2 && t < b + 0.2) s = Math.min(s, lerp(1, f, Math.min(smooth((t - a + 0.2) / 0.2), 1 - smooth((t - b) / 0.2)))); }
  return s * (1 - Pz(t));
}
const WT_DT = 1 / 240, WT = [0];
for (let i = 1; i * WT_DT <= DURATION + 1; i++) WT.push(WT[i - 1] + TS((i - .5) * WT_DT) * WT_DT);
function wt(t) { const f = clamp(t, 0, DURATION + .99) / WT_DT, i = Math.floor(f); return lerp(WT[i], WT[Math.min(i + 1, WT.length - 1)], f - i); }

// ================================================================= drawing helpers
const R = (x, y, w, h, f, ex = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${ex}/>`;
const C = (x, y, r, f, ex = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${ex}/>`;
const PTH = (d, f, ex = '') => `<path d="${d}" fill="${f}" ${ex}/>`;
const G = (id, inner, ex = '') => `<g ${id ? `id="${id}"` : ''} ${ex}>${inner}</g>`;
const DEFS = [];
function grad(id, stops, x2 = 0, y2 = 1) { DEFS.push(`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('')}</linearGradient>`); return `url(#${id})`; }
function rgrad(id, stops) { DEFS.push(`<radialGradient id="${id}">${stops.map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('')}</radialGradient>`); return `url(#${id})`; }
function buildings(seed, x0, x1, yb, hmin, hmax, cols, win, lit = .5, wmin = 120, wmax = 230) {
  const r = rng(seed); let s = '', x = x0;
  while (x < x1) {
    const w = wmin + r() * (wmax - wmin), h = hmin + r() * (hmax - hmin), c = cols[Math.floor(r() * cols.length)];
    s += R(x.toFixed(0), (yb - h).toFixed(0), w.toFixed(0), h.toFixed(0) * 1 + 4, c);
    if (r() < .35) s += R((x + w * .2).toFixed(0), (yb - h - 26).toFixed(0), (w * .25).toFixed(0), 28, c);
    const ww = 22, wh = 30, gx = 20, gy = 26;
    for (let yy = yb - h + 26; yy < yb - 60; yy += wh + gy) for (let xx = x + 16; xx < x + w - ww - 10; xx += ww + gx) {
      const on = r() < lit; s += R(xx.toFixed(0), yy.toFixed(0), ww, wh, on ? win[0] : win[1], on && win[2] ? `opacity="${win[2]}"` : '');
    }
    x += w + 6 + r() * 14;
  }
  return s;
}

// ================================================================= characters
const STY = {
  hero: { skin: '#f1c6a0', coat: '#e8453c', coatD: '#b8322a', pants: '#2d3f6b', shoe: '#f2f2f2', hair: '#2a2130', kind: 'hero', hs: 1 },
  girl: { skin: '#f7d2b1', coat: '#ffc928', coatD: '#e09e00', pants: '#ff7d96', shoe: '#e8453c', hair: '#7a4a2a', kind: 'girl', hs: 1.32 },
  nerd: { skin: '#eabf98', coat: '#3a7bd5', coatD: '#2b5ea8', pants: '#3b3b48', shoe: '#222', hair: '#6b4a2e', kind: 'nerd', hs: 1 },
  kid: { skin: '#c98e66', coat: '#7bc043', coatD: '#5a9a2c', pants: '#3b3b48', shoe: '#eee', hair: '#1d1410', kind: 'plain', hs: 1.1 },
  p1: { skin: '#e8b48f', coat: '#f4a259', coatD: '#d07f35', pants: '#4b4453', shoe: '#2b2b2b', hair: '#3b2a20', kind: 'plain', hs: 1 },
  p2: { skin: '#9b6b4b', coat: '#5b8e7d', coatD: '#3f6d5d', pants: '#2b2d42', shoe: '#2b2b2b', hair: '#111', kind: 'cap', hs: 1 },
  p3: { skin: '#f3d0b5', coat: '#bc4b51', coatD: '#8f3439', pants: '#344055', shoe: '#2b2b2b', hair: '#c9a26b', kind: 'long', hs: 1 },
  p4: { skin: '#d9a07c', coat: '#8e7dbe', coatD: '#6c5c9c', pants: '#3a3a3a', shoe: '#2b2b2b', hair: '#555', kind: 'hat', hs: 1 },
};
function personSVG(id, st, ex = '') {
  const k = st.kind, d = '#1a1420';
  let hair = '', back = '';
  if (k === 'hero') {
    back = st.hood ? `<path id="${id}_hood" d="M-84,-430 Q-90,-540 0,-548 Q90,-540 84,-430 Q70,-372 0,-366 Q-70,-372 -84,-430Z" fill="${st.coatD}"/>` : '';
    hair = `<path d="M-66,-446 Q-74,-522 -8,-520 Q52,-530 66,-468 Q70,-446 62,-432 L56,-466 Q42,-448 30,-480 Q16,-456 0,-486 Q-16,-458 -34,-482 Q-46,-458 -58,-474 Q-60,-456 -66,-446Z" fill="${st.hair}"/>
      <path d="M-30,-520 Q-20,-552 6,-540 Q-8,-530 -6,-518Z" fill="${st.hair}"/>`;
  } else if (k === 'girl') {
    back = `<path d="M-90,-430 Q-96,-548 0,-556 Q96,-548 90,-430 Q76,-370 0,-364 Q-76,-370 -90,-430Z" fill="${st.coat}"/><path d="M-90,-430 Q-96,-548 0,-556 Q96,-548 90,-430" fill="none" stroke="${st.coatD}" stroke-width="8"/>`;
    hair = `<path d="M-60,-468 Q-50,-512 0,-512 Q50,-512 60,-468 Q40,-486 20,-470 Q0,-490 -20,-470 Q-40,-488 -60,-468Z" fill="${st.hair}"/>`;
  } else if (k === 'nerd') {
    hair = `<path d="M-64,-450 Q-70,-520 0,-520 Q66,-520 64,-450 Q58,-488 20,-492 L-10,-470 Q-40,-490 -64,-450Z" fill="${st.hair}"/>`;
  } else if (k === 'cap') {
    hair = `<path d="M-64,-460 Q-60,-525 0,-525 Q60,-525 64,-460Z" fill="#e63946"/><path d="M-10,-462 L96,-458 L90,-446 L-10,-450Z" fill="#b22a35"/>`;
  } else if (k === 'long') {
    back = `<path d="M-74,-470 Q-80,-540 0,-540 Q80,-540 74,-470 L80,-360 L-80,-360Z" fill="${st.hair}"/>`;

// ================================================================= kinetic type
const KT = {};
function mkKT(id, text, size, top, color = '#fff', font = 'Unbounded', ls = -2) {
  const d = document.createElement('div'); d.className = 'kt'; d.id = id;
  d.style.fontSize = size + 'px'; d.style.top = top + 'px'; d.style.color = color; d.style.fontFamily = font; d.style.letterSpacing = ls + 'px';
  d.innerHTML = [...text].map(c => c === ' ' ? '<span style="width:.32em"> </span>' : `<span>${c}</span>`).join('');
  $('kts').appendChild(d); KT[id] = { el: d, sp: [...d.children] };
}

function ktShow(id, o, fn) { const k = KT[id]; k.el.style.opacity = clamp(o).toFixed(3); if (o <= 0) return; k.sp.forEach((s, i) => { const [x, y, sc, r, a] = fn(i, k.sp.length); s.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(1)}deg) scale(${sc.toFixed(3)})`; s.style.opacity = a === undefined ? 1 : clamp(a).toFixed(3); }); }
function ktIn(t, t0, i, n, stag = .045, from = 'up') { const k = spring((t - t0 - i * stag) / .55, 2.2, 6); const y = from === 'up' ? -140 : 140; return [0, (1 - k) * y, lerp(.4, 1, k), (1 - k) * (i % 2 ? 12 : -12), clamp((t - t0 - i * stag) / .12)]; }
