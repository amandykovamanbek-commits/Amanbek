<!doctype html><html><head><meta charset="utf-8"><style>

html,body{margin:0}

.glow{position:absolute;left:-200px;top:-560px;width:1700px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,138,61,.95),rgba(212,86,27,.6) 45%,transparent);filter:blur(40px)}

.arrow{position:absolute;left:968px;top:250px;font-size:90px;color:#fff;text-shadow:0 0 30px rgba(255,157,92,.9)}
.spark{position:absolute;stroke:#e07a50;stroke-width:17;stroke-linecap:round}
