<script>

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

// ============================================================ script
const SCENES = [

const norm = w => w.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]/g, '');

  else {
    let t = 0.3;
    TOK.forEach((tk, i) => {
      const d = 0.07 * tk.n.length + 0.1; tk.s = t; tk.e = t + d; t += d + 0.03;

  const laughing = between(T.laugh, T.alone + .4);
  setT($('kUp'), `translate(0 ${kSit ? 300 : Math.sin(t * 2 + 1) * 2 + (laughing ? Math.abs(Math.sin(t * 14)) * -10 : 0)})`);
  $('kLegs').setAttribute('opacity', kSit ? 0 : 1); $('kSitFront').setAttribute('opacity', kSit ? 1 : 0);
  setT($('hHead'), `translate(0 -800) rotate(${noise(t, .7) * 2} 0 120)`);
  setT($('kHead'), `translate(0 -800) rotate(${noise(t, .6, 2) * 1.5 + (laughing ? Math.sin(t * 9) * 5 : 0)} 0 120)`);
  // kreed arms
  const give = clamp((t - T.give) / .4);
  const adj = between(T.adjust, T.adjust + 1.2) || between(W('s18', 'поправляет'), W('s18', 'поправляет') + 1.0);
  const pinchArm = between(T.kIn, T.adjust) ? 1 : 0;
  setT($('kArmR'), `translate(150 -640) rotate(${t >= T.give ? lerp(-12, -128, easeOutBack(give)) : adj ? -150 + Math.sin(t * 6) * 4 : pinchArm ? -12 + Math.sin(t * 25) * 8 : -12})`);
  $('kTk').setAttribute('opacity', give > .5 ? 1 : 0);
  setT($('kArmL'), `translate(-150 -640) rotate(${between(T.railOff, T.sit) ? 70 : between(T.jump, T.bonk) ? 160 : 12 + Math.sin(t * 2) * 1.5})`);
  setT($('hArmL'), `translate(-150 -640) rotate(${12 + Math.sin(t * 2.2) * 1.5})`);
  setT($('hArmR'), `translate(150 -640) rotate(-12)`);
  $('kGl').setAttribute('opacity', (t >= T.glOff + .25 && t < T.glOn + .25) ? 0 : 1);
  // stars after bonk / trip / pinch
  const dizzy = between(T.bonk + .05, S('s14').start) ? 1 : 0;
  $('dizzy').setAttribute('opacity', dizzy && bg === 'cabin' ? 1 : 0);
  if (dizzy) { setT($('dizzy'), `translate(${KX} ${HEADY - 160})`); document.querySelectorAll('#dizzy .st').forEach((s, i) => { const a = t * 4 + i * 2.1; setT(s, `translate(${Math.cos(a) * 130} ${Math.sin(a) * 30})`); }); }
  // rail
  const rk = clamp((t - T.railOff) / .5);
  setT($('rail'), t >= T.railOff ? `translate(${rk * 40} ${easeIn(rk) * 380}) rotate(${rk * 14} 540 1263)` : '');
  // moods
  let hm = 'neutral', km = 'cool';
  const id = sc.id;
  if (id === 's1') { hm = 'nervous'; km = 'cool'; }
  if (id === 's4') { hm = t < T.cute ? 'shock' : 'deadpan'; km = t < T.adjust ? 'ouch' : 'smileT'; }
  if (id === 's5') { hm = t < T.blink ? 'deadpan' : t < T.stop ? 'nervous' : 'shock'; km = t < T.stop ? 'cool' : 'serious'; }
  if (id === 's6') { hm = 'deadpan'; km = t < T.laugh ? 'smileT' : 'laugh'; }
  if (id === 's8') { hm = 'nervous'; km = 'smileT'; }
  if (id === 's9') { hm = 'deadpan'; km = t < T.charisma + .1 ? 'smileT' : 'laugh'; if (t > T.c70) km = 'smileT'; }
  if (id === 's10') { hm = t < T.railOff ? 'deadpan' : 'shock'; km = t < T.railOff ? 'cool' : 'shock'; }
  if (id === 's11') { hm = 'deadpan'; km = 'stare'; }
  if (id === 's12') { hm = t < T.sang ? 'deadpan' : 'shock'; km = t < T.song ? 'stare' : 'proud'; if (t > T.mouth) hm = 'deadpan'; }
  if (id === 's13') { hm = t < T.bonk ? 'nervous' : 'shock'; km = t < T.bonk ? 'serious' : 'ouch'; }
  if (id === 's14') { hm = 'scared'; km = 'ouch'; }
  if (id === 's15') { hm = 'happy'; km = 'smileT'; }
  if (id === 's16') { hm = 'happy'; km = 'smileT'; }
  if (id === 's17') { hm = t < T.trip ? 'neutral' : 'shock'; km = t < T.trip ? 'cool' : 'ouch'; }
  if (id === 's18') { hm = t < T.tix ? 'deadpan' : 'shock'; km = t < T.perf ? 'cool' : 'smileT'; if (t > T.tix + .9) hm = 'happy'; }
  const talkK = TOK.some(tk => tk.q === 'k' && t >= tk.s && t < tk.e) && !(id === 's12');
  applyMood('h', t, MOODS[hm]); applyMood('k', t, MOODS[km], { talk: talkK || laughing });
  $('notes').setAttribute('opacity', 0);
  $('dimG').setAttribute('opacity', between(T.meter, S('s8').end) ? 1 : 0);

  // ---------- lighting
  const redOn = (t < S('s2').start) || (t >= T.stop && t < S('s16').start);
  let flick = 1;
  if (between(T.blink, T.blink + .8)) flick = Math.sin(t * 47) > .2 ? 1 : .35;
  if (between(0, .6)) flick = Math.sin(t * 40) > 0 ? 1 : .5;
  $('redTint').setAttribute('opacity', redOn && (bg === 'cabin' || bg === 'doors') ? .3 + .06 * Math.sin(t * 3) : 0);
  $('darkOv').setAttribute('opacity', 0); $('darkFx').setAttribute('opacity', 0);
  $('cabLamp').setAttribute('fill', redOn ? '#ff4a3a' : '#fff8e0');
  // ---------- per-bg animation
  if (bg === 'tower') { $('towerShaft').setAttribute('opacity', .3 + .3 * Math.sin(t * 4)); }
  if (bg === 'doors') {
    const cl = clamp((t - S('s3').start) / Math.max(.3, T.hand - S('s3').start));
    let gap = lerp(.9, .3, easeInOut(cl));
    if (t > T.hand) gap = lerp(.3, .07, easeIn(clamp((t - T.hand) / Math.max(.3, T.pinch - T.hand))));
    if (t > T.pinch) gap = .07 + Math.abs(Math.sin(t * 30)) * .01 * decay(t, T.pinch, 3);
    $('hHands').setAttribute('opacity', 0);
    const hk = clamp((t - T.hand + .1) / .25); $('kHand').setAttribute('opacity', hk);
    const sq = t > T.pinch ? 1 - .25 * easeOut(clamp((t - T.pinch) / .15)) : 1;
    setT($('kHand'), `translate(540 1000) scale(${lerp(.6, 1, easeOutBack(hk)) * sq} ${lerp(.6, 1, easeOutBack(hk))}) rotate(${t > T.pinch ? Math.sin(t * 40) * 6 * decay(t, T.pinch, 2) : 0}) translate(-540 -1000)`);
    setT($('leafL'), `translate(${-gap * 340} 0)`); setT($('leafR'), `translate(${gap * 340} 0)`);
  }
  if (bg === 'display') {
    const k = clamp((t - S('s5').start) / 1.2), n = Math.max(1, Math.round(lerp(1, 27, easeOut(k))));
    $('dispNum').textContent = n; $('dispNum').setAttribute('opacity', flick < 1 ? .3 : 1);
    $('dispArrow').setAttribute('opacity', Math.sin(t * 8) > -.3 ? 1 : .2);
  }
  if (bg === 'shaft') {
    let y = 960 + (t > T.jolt ? lerp(0, 120, easeOutBack(clamp((t - T.jolt) / .3))) : 0);
    setT($('shCab'), `translate(0 ${y})`);
    setT($('miniH'), `translate(470 140) scale(.3)`); setT($('miniK'), `translate(615 140) scale(.3)`);
    $('shArrow').setAttribute('opacity', 0);
    $('shCatch').setAttribute('opacity', t > T.jolt + .2 ? (Math.sin(t * 10) > -.5 ? 1 : .4) : 0);
  }
  if (bg === 'panel') {
    const fk = easeInOut(clamp((t - S('s7').start) / Math.max(.3, T.press - S('s7').start)));
    const pressed = t >= T.press && t < T.hiss;
    setT($('finger'), `translate(${lerp(260, 0, fk)} ${lerp(500, 0, fk) + (pressed ? 8 : 0)})`);
    $('bellRing').setAttribute('stroke-dashoffset', 880 * (1 - clamp((t - T.press) / Math.max(.3, T.hiss - T.press))));
    $('bellBtn').setAttribute('fill', pressed ? '#ffe28a' : '#FFC83D');
    const talk = t >= T.hiss;
    document.querySelectorAll('.spk').forEach((d, i) => d.setAttribute('fill', talk && Math.sin(t * 14 + i * .7) > -.2 ? '#ff9b2f' : '#2a2d34'));
  }
  if (land) document.querySelectorAll('.cflash').forEach((f, i) => { const ph = (t * (t > T.trip ? 4 : 1.3) + i * .37) % 1; f.setAttribute('fill', t > T.crowd && ph < .1 ? '#ffffff' : '#9fd0ff'); });

  // ---------- overlays
  OVS.forEach(o => {
    const st = popState(t, o[0], o[1], o[5] && o[5].noOut);
    if (!st) { o.el.style.opacity = 0; return; }
    const r = (o[5] && o[5].rot) || 0;
    o.el.style.opacity = st.o;
    o.el.style.transform = `translate(${o[3]}px, ${o[4] + st.y}px) translate(-50%,0) scale(${st.s}) rotate(${r + Math.sin(t * 1.5 + o[0]) * .6}deg)`;
    o.rows.forEach(rw => { const k = clamp((t - +rw.dataset.t) / .25); rw.style.opacity = k; rw.style.transform = `translateX(${(1 - easeOut(k)) * -30}px)`; });
  });
  $('tag').style.opacity = 0;
  // timecode
  const stuck = t >= T.stop;
  const tc = $('tc');
  tc.style.opacity = t >= S('s2').start && t < S('s19').start ? 1 : 0;
  tc.textContent = t >= S('s16').start ? '22:24 · 27 ЭТАЖ · СВОБОДА' : stuck ? '21:43 · МЕЖДУ 27 И 28' : '21:40 · МОСКВА · 40 ЭТ.';
  tc.className = stuck && t < S('s16').start ? 'red' : '';
  // elapsed clock
  const CK = [[T.stop, 0], [S('s8').start, 60], [S('s9').start, 300], [S('s10').start, 600], [S('s11').start, 1200], [S('s13').start, 1800], [S('s15').start, 2400], [S('s16').start, 2460]];
  let secs = 0; for (let i = 0; i < CK.length; i++) { if (t >= CK[i][0]) { const nx = CK[i + 1]; secs = nx ? lerp(CK[i][1], nx[1], clamp((t - CK[i][0]) / .8)) : CK[i][1]; } }
  const ck = $('clock'); ck.style.opacity = t >= S('s8').start && t < S('s19').start ? 1 : 0;
  ck.textContent = `⏱ В ЛИФТЕ ${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(Math.floor(secs % 60)).padStart(2, '0')}`;
  // cringe meter
  let cv = 0; T.cringe.forEach(([a, v], i) => { if (t >= a) { const prev = i ? T.cringe[i - 1][1] : 0; cv = lerp(prev, v, easeOutBack(clamp((t - a) / .5))); } });
  const cm = $('cringe'); const cmOn = t >= T.laugh && t < S('s19').start && bg !== 'black';
  cm.style.opacity = cmOn ? 1 : 0;
  if (cmOn) {
    $('cringeFill').style.width = clamp(cv, 0, 100) + '%'; $('cringeVal').textContent = Math.round(clamp(cv, 0, 100)) + '%';
    const bump = Math.max(...T.cringe.map(([a]) => decay(t, a, 5)));
    cm.style.transform = `scale(${1 + .12 * bump}) rotate(${Math.sin(t * 50) * 3 * bump}deg)`;
    $('cringeFill').style.background = cv >= 99 ? (Math.sin(t * 12) > 0 ? '#ff3b30' : '#ffd43b') : 'linear-gradient(90deg,#ffd43b,#ff3b30)';
  }

  // ---------- subtitles
  const ch = CHUNKS.find(c => t >= c.s && t < c.e);
  const subs = $('subs');
  if (!ch || t > VO_END + .5) { subs.innerHTML = ''; subs._c = null; }
  else {
    if (subs._c !== ch) { subs.innerHTML = ch.map(tk => `<span>${tk.w.replace(/[«»]/g, '')}</span>`).join(' '); subs._c = ch; }
    const sp = subs.children, k = clamp((t - ch.s) / .12);
    subs.style.transform = `scale(${.92 + .08 * easeOutBack(k)})`; subs.style.opacity = clamp((t - ch.s) / .06);
    ch.forEach((tk, i) => {
      const said = t >= tk.s - .04;
      let col = tk.q ? QCOL[tk.q] : KEY_R.includes(tk.n) ? '#ff3b30' : KEY_Y.includes(tk.n) ? '#FFD43B' : '#ffffff';
      sp[i].style.color = said ? col : '#8d92a3';
      const on = said && (i === ch.length - 1 || t < ch[i + 1].s - .04);
      const kk = on ? clamp((t - tk.s + .04) / .12) : 0;
      sp[i].style.transform = `scale(${1 + .08 * Math.sin(Math.PI * kk)})`;
    });
  }
  $('flash').style.opacity = .5 * Math.max(decay(t, T.stop, 9), decay(t, T.open + .1, 4), decay(t, T.tix, 8), decay(t, T.trip + .2, 6));
  const fadeOut = clamp((t - (DURATION - .4)) / .4), fadeIn = 1 - clamp(t / .25);
  const br = (bg === 'cabin' || bg === 'display' ? flick : 1) * (1 - fadeOut) * (1 - fadeIn);
  $('stage').style.filter = br < .999 ? `brightness(${br.toFixed(3)})` : 'none';
};
window.READY = true;
if (!/render/.test(location.search)) {
  const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $('stage').style.transform = `scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const t0 = performance.now();
  const loop = () => { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
