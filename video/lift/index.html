      if (t > T.hand) gap = lerp(.05, .9, easeOut(clamp((t - T.hand - .3) / .8)));
      $('hHands').setAttribute('opacity', 0);
      const hk = clamp((t - T.hand + .1) / .25); $('kHand').setAttribute('opacity', hk);
      setT($('kHand'), `translate(540 1000) scale(${lerp(.6, 1, easeOutBack(hk))}) translate(-540 -1000)`);
    }
    setT($('leafL'), `translate(${-gap * 340} 0)`); setT($('leafR'), `translate(${gap * 340} 0)`);
  }
  if (bg === 'display') {
    const k = clamp((t - S('s5').start) / 1.2), n = Math.max(1, Math.round(lerp(1, 27, easeOut(k))));
    $('dispNum').textContent = n; $('dispNum').setAttribute('opacity', flick < 1 ? .3 : 1);
    $('dispArrow').setAttribute('opacity', Math.sin(t * 8) > -.3 ? 1 : .2);
  }
  if (bg === 'shaft') {
    const s14 = t >= S('s14').start;
    let y = 960;
    if (s14) y += t > T.jolt ? lerp(0, 60, easeOutBack(clamp((t - T.jolt) / .25))) : 0;
    setT($('shCab'), `translate(0 ${y})`);
    const jump = s14 && t < T.catch ? Math.abs(Math.sin(t * 8)) * 40 : 0;
    setT($('miniH'), `translate(470 ${140 - jump}) scale(.3)`); setT($('miniK'), `translate(615 ${140 - jump * .8}) scale(.3)`);
    $('shArrow').setAttribute('opacity', t >= T.shaft1 && t < S('s8').end ? clamp((t - T.shaft1) / .3) : 0);
    $('shCatch').setAttribute('opacity', s14 && t >= T.catch ? (Math.sin(t * 10) > -.5 ? 1 : .4) : 0);
  }
  if (bg === 'panel') {
    const fk = easeInOut(clamp((t - S('s9').start) / Math.max(.3, T.press - S('s9').start)));
    const pressed = t >= T.press && t < T.hiss;
    setT($('finger'), `translate(${lerp(260, 0, fk)} ${lerp(500, 0, fk) + (pressed ? 8 : 0)})`);
    $('bellRing').setAttribute('stroke-dashoffset', 880 * (1 - clamp((t - T.hold) / 1.35)));
    $('bellBtn').setAttribute('fill', pressed ? '#ffe28a' : '#FFC83D');
    const talk = t >= T.hiss;
    document.querySelectorAll('.spk').forEach((d, i) => d.setAttribute('fill', talk && Math.sin(t * 14 + i * .7) > -.2 ? '#ff9b2f' : '#2a2d34'));
  }
  if (bg === 'phone') {
    const dr = clamp((t - T.eat) / 1.4), pct = lerp(12, 1, easeInOut(dr));
    const h = 344 * pct / 100 * 2.2;
    $('batFill').setAttribute('y', 18 + 344 - h); $('batFill').setAttribute('height', h);
    $('batTxt').textContent = Math.round(pct) + '%';
    $('batTxt').setAttribute('opacity', t >= T.pct ? (Math.sin(t * 7) > -.4 ? 1 : .4) : .2);
  }
  if (land) document.querySelectorAll('.cflash').forEach((f, i) => { const ph = (t * 1.3 + i * .37) % 1; f.setAttribute('fill', t > T.crowd && ph < .08 ? '#ffffff' : '#9fd0ff'); });

  // ---------- overlays
  OVS.forEach(o => {
    const st = popState(t, o[0], o[1], o[5] && o[5].noOut);
    if (!st) { o.el.style.opacity = 0; return; }
    const r = (o[5] && o[5].rot) || 0;
    o.el.style.opacity = st.o;
    o.el.style.transform = `translate(${o[3]}px, ${o[4] + st.y}px) translate(-50%,0) scale(${st.s}) rotate(${r + Math.sin(t * 1.5 + o[0]) * .6}deg)`;
    o.rows.forEach(rw => { const k = clamp((t - +rw.dataset.t) / .25); rw.style.opacity = k; rw.style.transform = `translateX(${(1 - easeOut(k)) * -30}px)`; });
  });
  // tag
  const tg = T.tags.find(([a, b]) => t >= a && t < b + .2);
  if (tg) { const st = popState(t, tg[0], tg[1]); const el = $('tag');
    if (st) { el.textContent = tg[2]; el.style.background = tg[3][0]; el.style.color = tg[3][1]; el.style.opacity = st.o; el.style.transform = `translateX(-50%) scale(${st.s}) rotate(-1.5deg)`; } else el.style.opacity = 0; }
  else $('tag').style.opacity = 0;
  // timecode
  const stuck = t >= T.stop;
  const tc = $('tc');
  const showTc = t >= S('s2').start && t < S('s20').start;
  tc.style.opacity = showTc ? 1 : 0;
  tc.textContent = t >= S('s18').start ? '22:24 · 27 ЭТАЖ · СВОБОДА' : stuck ? '21:43 · МЕЖДУ 27 И 28' : '21:40 · МОСКВА · 40 ЭТ.';
  tc.className = stuck && t < S('s18').start ? 'red' : '';
  // elapsed clock
  const CK = [[T.stop, 0], [S('s10').start, 60], [S('s12').start, 600], [S('s13').start, 1200], [S('s14').start, 1800], [S('s15').start, 2280], [S('s17').start, 2400], [S('s18').start, 2460]];
  let secs = 0; for (let i = 0; i < CK.length; i++) { if (t >= CK[i][0]) { const nx = CK[i + 1]; secs = nx ? lerp(CK[i][1], nx[1], clamp((t - CK[i][0]) / .8)) : CK[i][1]; } }
  const ck = $('clock'); ck.style.opacity = t >= S('s10').start && t < S('s20').start ? 1 : 0;
  ck.textContent = `⏱ В ЛИФТЕ ${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(Math.floor(secs % 60)).padStart(2, '0')}`;

  // ---------- subtitles
  const ch = CHUNKS.find(c => t >= c.s && t < c.e);
  const subs = $('subs');
  if (!ch || t > VO_END + .5) { subs.innerHTML = ''; subs._c = null; }
  else {
    if (subs._c !== ch) { subs.innerHTML = ch.map(tk => `<span>${tk.w.replace(/[«»]/g, '')}</span>`).join(' '); subs._c = ch; }
    const sp = subs.children, k = clamp((t - ch.s) / .12);
    subs.style.transform = `scale(${.92 + .08 * easeOutBack(k)})`; subs.style.opacity = clamp((t - ch.s) / .06);
    ch.forEach((tk, i) => {
      const said = t >= tk.s - .04;
      let col = tk.q ? QCOL[tk.q] : KEY_R.includes(tk.n) ? '#ff3b30' : KEY_Y.includes(tk.n) ? '#FFD43B' : '#ffffff';
      sp[i].style.color = said ? col : '#8d92a3';
      const on = said && (i === ch.length - 1 || t < ch[i + 1].s - .04);
      const kk = on ? clamp((t - tk.s + .04) / .12) : 0;
      sp[i].style.transform = `scale(${1 + .08 * Math.sin(Math.PI * kk)})`;
    });
  }
  // flash, global brightness
  $('flash').style.opacity = .5 * Math.max(decay(t, T.stop, 9), decay(t, T.three, 8), decay(t, T.open + .1, 4), decay(t, T.tix, 8));
  const fadeOut = clamp((t - (DURATION - .4)) / .4), fadeIn = 1 - clamp(t / .25);
  const br = (bg === 'cabin' || bg === 'display' ? flick : 1) * (1 - fadeOut) * (1 - fadeIn);
  $('stage').style.filter = br < .999 ? `brightness(${br.toFixed(3)})` : 'none';
};
window.READY = true;
if (!/render/.test(location.search)) {
  const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $('stage').style.transform = `scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const t0 = performance.now();
  const loop = () => { renderAt(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
