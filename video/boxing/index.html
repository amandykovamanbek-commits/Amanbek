<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Бокс — моушн-эдит</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;max-height:100vh;margin:0 auto}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
/* =========================================================================
   БОКС — 30s vertical motion edit. Pure function of time: renderAt(t).
   Music grid: 139.5 BPM, beat n at BT(n). Drop at 13.75s.
   ========================================================================= */
const W = 1080, H = 1920, DUR = 30.0;
window.DURATION = DUR;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const Lc = mk(W, H), L = Lc.getContext('2d');      // content layer of the active shot
const Mc = mk(W, H), M = Mc.getContext('2d');      // shutter accumulation buffer
const Bc = mk(270, 480), B = Bc.getContext('2d');  // bloom buffer

/* ---------- math ---------- */
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const lin = (t, a, b) => cl((t - a) / (b - a));
const p4i = u => u * u * u * u, p4o = u => 1 - Math.pow(1 - u, 4);
const p3i = u => u * u * u, p3o = u => 1 - Math.pow(1 - u, 3);
const eo = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u);
const bellc = u => Math.pow(Math.sin(Math.PI * cl(u)), 2);
function bez(x1, y1, x2, y2) {
  return u => {
    if (u <= 0) return 0; if (u >= 1) return 1;
    let x = u;
    for (let i = 0; i < 10; i++) {
      const fx = 3 * x1 * x * (1 - x) ** 2 + 3 * x2 * x * x * (1 - x) + x ** 3 - u;
      const d = 3 * x1 * (1 - x) ** 2 + 6 * (x2 - x1) * x * (1 - x) + 3 * (1 - x2) * x * x;
      if (Math.abs(d) < 1e-6) break; x = cl(x - fx / d);
    }
    return 3 * y1 * x * (1 - x) ** 2 + 3 * y2 * x * x * (1 - x) + x ** 3;
  };
}
const aeBell = bez(.70, 0, .30, 1), aeSoft = bez(.58, 0, .42, 1);
const logz = (a, b, u) => Math.exp(lerp(Math.log(a), Math.log(b), u));
const backO = (u, s = 1.6) => { u = cl(u); const c = s + 1; return 1 + c * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
const spring = (dt, w = 12, k = 4) => dt < 0 ? 0 : Math.exp(-k * dt) * Math.sin(w * dt);
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const BT = n => 0.415 + 0.4301 * n;   // music beat grid

/* ---------- fonts ---------- */
const FD = '"Inter Display", Inter, sans-serif', FM = '"JetBrains Mono", monospace';

/* ---------- text ---------- */
function T(g, s, x, y, size, o = {}) {
  s = s.replace(/ /g, '\u2004'); g.save();
  g.font = `${o.w || 900} ${size}px ${o.f || FD}`;
  g.letterSpacing = ((o.ls ?? -0.035) * size) + 'px';
  g.textAlign = o.al || 'center'; g.textBaseline = 'alphabetic';
  const wd = g.measureText(s).width, sc = (o.max && wd > o.max) ? o.max / wd : 1;
  g.translate(x, y); if (o.sk) g.transform(1, 0, o.sk, 1, 0, 0); g.scale(sc * (o.s || 1), sc * (o.s || 1));
  g.globalAlpha *= (o.a ?? 1);
  if (o.rgb) {
    const ga = g.globalAlpha;
    g.globalAlpha = ga * .85; g.fillStyle = '#ff1e3c'; g.fillText(s, -o.rgb, 0);
    g.fillStyle = '#00d8ff'; g.fillText(s, o.rgb, 0); g.globalAlpha = ga;
  }
  if (o.stroke) { g.lineWidth = o.lw || 4; g.strokeStyle = o.stroke; g.strokeText(s, 0, 0); }
  if (!o.noFill) { g.fillStyle = typeof o.c === 'function' ? o.c(g, size) : (o.c || '#fff'); g.fillText(s, 0, 0); }
  g.restore();
  return wd * sc;
}
// waterfall: per-character staggered arrival (mid-flight ignition at .35 opacity)
// exit:{t0} makes chars leave LEFT on power4.in (waterfall cut).
function TW(g, s, x, y, size, lt, o = {}) {
  g.save();
  g.font = `${o.w || 900} ${size}px ${o.f || FD}`; g.letterSpacing = '0px';
  const ls = (o.ls ?? -0.035) * size, ch = [...s], ws = ch.map(c => g.measureText(c).width + (c === ' ' && !o.f ? size * .1 : 0));
  const tot = ws.reduce((a, b) => a + b, 0) + ls * (ch.length - 1);
  const sc = (o.max && tot > o.max) ? o.max / tot : 1;
  g.translate(x, y); if (o.sk) g.transform(1, 0, o.sk, 1, 0, 0); g.scale(sc * (o.s || 1), sc * (o.s || 1));
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let cx = o.al === 'left' ? 0 : -tot / 2;
  const st = o.st ?? 0.032, du = o.du ?? 0.42, off = o.off ?? size * 0.6, dir = o.dir || 'up';
  const ga = g.globalAlpha * (o.a ?? 1);
  ch.forEach((c, i) => {
    const u = cl((lt - i * st) / du);
    if (u > 0) {
      const e = p4o(u); let a = Math.min(1, .35 + u * 2.6), dx = 0, dy = 0;
      if (dir === 'up') dy = (1 - e) * off; else if (dir === 'down') dy = -(1 - e) * off; else if (dir === 'left') dx = (1 - e) * off;
      if (o.exit != null) {
        const v = cl((lt - o.exit - i * 0.022) / 0.34);
        dx -= 230 * p4i(v); a *= 1 - cl(v / 0.55);
      }
      if (a > 0.002) {
        g.globalAlpha = ga * a;
        if (o.rgb) { g.fillStyle = '#ff1e3c'; g.fillText(c, cx + dx - o.rgb, dy); g.fillStyle = '#00d8ff'; g.fillText(c, cx + dx + o.rgb, dy); }
        g.fillStyle = typeof o.c === 'function' ? o.c(g, size) : (o.c || '#fff');
        g.fillText(c, cx + dx, dy);
      }
    }
    cx += ws[i] + ls;
  });
  g.restore();
}
const goldFill = (g, size) => { const gr = g.createLinearGradient(0, -size * .8, 0, size * .05); gr.addColorStop(0, '#fff6cf'); gr.addColorStop(.45, '#f6c14a'); gr.addColorStop(.75, '#c8871c'); gr.addColorStop(1, '#ffe08a'); return gr; };

/* ---------- drawing primitives ---------- */
function bgFill(g, c) { g.fillStyle = c; g.fillRect(-600, -600, W + 1200, H + 1200); }
function glow(g, x, y, r, rgb, a) {
  if (a <= 0) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(.5, `rgba(${rgb},${a * .35})`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

// Side-profile boxing glove. Knuckles point to +x. ~460 x 340 at s=1.
function glove(g, x, y, s, rot, o = {}) {
  const col = o.col || '#d0141f', hi = o.hi || '#ff5a4a', dk = o.dk || '#4a0207';
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s * (o.flip ? -1 : 1), s);
  // cuff
  let gr = g.createLinearGradient(0, -120, 0, 130);
  gr.addColorStop(0, hi); gr.addColorStop(.35, col); gr.addColorStop(1, dk);
  rr(g, -262, -112, 170, 232, 34); g.fillStyle = gr; g.fill();
  g.fillStyle = 'rgba(255,255,255,.92)'; g.fillRect(-205, -112, 26, 232);           // white band
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(-179, -112, 6, 232);
  // laces on cuff top
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 6;
  for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(-250 + i * 12, -100 + i * 52); g.lineTo(-232 + i * 12, -78 + i * 52); g.stroke(); }
  // body
  g.beginPath();
  g.moveTo(-130, -118);
  g.bezierCurveTo(-70, -200, 120, -200, 178, -96);
  g.bezierCurveTo(226, -12, 212, 92, 140, 128);
  g.bezierCurveTo(66, 166, -62, 156, -130, 122);
  g.closePath();
  gr = g.createRadialGradient(10, -95, 10, 30, -20, 270);
  gr.addColorStop(0, hi); gr.addColorStop(.35, col); gr.addColorStop(.85, dk); gr.addColorStop(1, '#2a0004');
  g.fillStyle = gr; g.fill();
  // thumb
  g.beginPath();
  g.moveTo(-60, 48); g.bezierCurveTo(10, 14, 128, 26, 152, 84);
  g.bezierCurveTo(142, 136, 30, 152, -60, 130); g.closePath();
  gr = g.createLinearGradient(0, 20, 0, 150); gr.addColorStop(0, col); gr.addColorStop(1, dk);
  g.fillStyle = gr; g.fill();
  g.strokeStyle = 'rgba(30,0,4,.55)'; g.lineWidth = 5; g.stroke();
  // seam + specular
  g.setLineDash([10, 9]); g.strokeStyle = 'rgba(255,220,210,.35)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-110, -96); g.bezierCurveTo(-50, -160, 110, -165, 160, -82); g.stroke(); g.setLineDash([]);
  g.globalAlpha *= .55; g.strokeStyle = '#fff'; g.lineWidth = 14; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-40, -150); g.bezierCurveTo(20, -172, 90, -160, 130, -120); g.stroke();
  g.restore();
}
// Glove seen from the front (knuckles toward the lens).
function gloveFront(g, x, y, s, rot) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  let gr = g.createLinearGradient(0, 120, 0, 330); gr.addColorStop(0, '#7a0610'); gr.addColorStop(1, '#2a0004');
  rr(g, -150, 120, 300, 220, 40); g.fillStyle = gr; g.fill();
  g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(-150, 230, 300, 26);
  g.beginPath(); g.ellipse(0, 0, 210, 240, 0, 0, Math.PI * 2);
  gr = g.createRadialGradient(-40, -90, 10, 0, 0, 260);
  gr.addColorStop(0, '#ff6a58'); gr.addColorStop(.35, '#d0141f'); gr.addColorStop(.85, '#5a030b'); gr.addColorStop(1, '#2a0004');
  g.fillStyle = gr; g.fill();
  g.beginPath(); g.ellipse(-150, 70, 70, 130, .25, 0, Math.PI * 2);
  gr = g.createLinearGradient(-220, 0, -80, 0); gr.addColorStop(0, '#4a0207'); gr.addColorStop(1, '#b0101a');
  g.fillStyle = gr; g.fill(); g.strokeStyle = 'rgba(30,0,4,.6)'; g.lineWidth = 6; g.stroke();
  g.globalAlpha *= .5; g.strokeStyle = '#fff'; g.lineWidth = 16; g.lineCap = 'round';
  g.beginPath(); g.ellipse(0, -10, 150, 190, 0, -2.5, -1.2); g.stroke();
  g.restore();
}
function heavyBag(g, px, py, ang, hitGlow, hitY) {
  g.save(); g.translate(px, py); g.rotate(ang);
  g.strokeStyle = '#8a8f99'; g.lineWidth = 7;
  [[-150, 300], [150, 300], [-60, 300], [60, 300]].forEach(([x, y]) => { g.beginPath(); g.moveTo(0, 0); g.lineTo(x, y); g.stroke(); });
  g.beginPath(); g.arc(0, 0, 18, 0, Math.PI * 2); g.lineWidth = 9; g.stroke();
  const gr = g.createLinearGradient(-175, 0, 175, 0);
  gr.addColorStop(0, '#050506'); gr.addColorStop(.32, '#3a3a42'); gr.addColorStop(.45, '#26262b'); gr.addColorStop(1, '#040405');
  rr(g, -175, 290, 350, 920, 70); g.fillStyle = gr; g.fill();
  const rb = g.createLinearGradient(-175, 0, 175, 0);
  rb.addColorStop(0, '#3a0207'); rb.addColorStop(.32, '#e0202c'); rb.addColorStop(1, '#2a0004');
  g.fillStyle = rb; g.fillRect(-175, 380, 350, 46); g.fillRect(-175, 1080, 350, 46);
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(-70, 300, 26, 900);
  if (hitGlow > 0.01) { g.globalCompositeOperation = 'lighter'; glow(g, 160, hitY - py, 260, '255,90,60', hitGlow * .8); g.globalCompositeOperation = 'source-over'; }
  g.restore();
}
function belt(g, cx, cy, s, sheen) {
  g.save(); g.translate(cx, cy); g.scale(s, s);
  let gr = g.createLinearGradient(0, -110, 0, 110); gr.addColorStop(0, '#2a2a2e'); gr.addColorStop(.5, '#0b0b0d'); gr.addColorStop(1, '#1a1a1d');
  g.fillStyle = gr; g.fillRect(-900, -105, 1800, 210);
  g.fillStyle = '#d9a43a'; g.fillRect(-900, -105, 1800, 10); g.fillRect(-900, 95, 1800, 10);
  g.setLineDash([12, 10]); g.strokeStyle = 'rgba(240,200,110,.5)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(-900, -80); g.lineTo(900, -80); g.moveTo(-900, 80); g.lineTo(900, 80); g.stroke(); g.setLineDash([]);
  const gold = (x0, y0, r) => { const q = g.createRadialGradient(x0 - r * .3, y0 - r * .4, r * .05, x0, y0, r * 1.1); q.addColorStop(0, '#fff7d0'); q.addColorStop(.35, '#f4c04a'); q.addColorStop(.75, '#a8701a'); q.addColorStop(1, '#5a3a08'); return q; };
  [-560, -380, 380, 560].forEach(x => { rr(g, x - 75, -95, 150, 190, 26); g.fillStyle = gold(x, 0, 120); g.fill(); g.strokeStyle = '#6a4508'; g.lineWidth = 4; g.stroke(); });
  g.beginPath(); g.ellipse(0, 0, 270, 220, 0, 0, Math.PI * 2); g.fillStyle = gold(0, 0, 270); g.fill();
  g.lineWidth = 10; g.strokeStyle = '#7a520c'; g.stroke();
  g.beginPath(); g.ellipse(0, 0, 225, 180, 0, 0, Math.PI * 2); g.lineWidth = 5; g.strokeStyle = 'rgba(255,240,190,.8)'; g.stroke();
  g.beginPath(); g.arc(0, 0, 105, 0, Math.PI * 2);
  const jr = g.createRadialGradient(-30, -40, 5, 0, 0, 110); jr.addColorStop(0, '#ff6a6a'); jr.addColorStop(.5, '#c0101a'); jr.addColorStop(1, '#4a0006');
  g.fillStyle = jr; g.fill(); g.lineWidth = 8; g.strokeStyle = '#f4c04a'; g.stroke();
  g.beginPath();
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 34 : 80, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  g.closePath(); g.fillStyle = gold(0, -10, 80); g.fill();
  if (sheen > 0 && sheen < 1) {
    g.save(); g.beginPath(); g.ellipse(0, 0, 270, 220, 0, 0, Math.PI * 2); g.clip();
    const sx = lerp(-420, 420, sheen); const sg = g.createLinearGradient(sx - 90, 0, sx + 90, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.75)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sg; g.transform(1, 0, -.4, 1, 0, 0); g.fillRect(-700, -300, 1400, 600); g.restore();
  }
  g.restore();
}
function ropes(g, y0, sag, col) {
  [0, 1, 2].forEach(i => {
    const y = y0 + i * 92;
    g.beginPath(); g.moveTo(-100, y); g.quadraticCurveTo(W / 2, y + sag, W + 100, y - 10);
    g.lineWidth = 30; g.strokeStyle = col; g.stroke();
    g.lineWidth = 7; g.strokeStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.moveTo(-100, y - 8); g.quadraticCurveTo(W / 2, y + sag - 8, W + 100, y - 18); g.stroke();
  });
}

/* ---------- pre-baked textures ---------- */
let GR = [], VIG, LEA, CANV, DUST = [], BOK = [], CONF = [], FLASHES = [];
function bake() {
  const R = mulberry(7);
  for (let k = 0; k < 4; k++) {
    const c = mk(540, 960), g = c.getContext('2d'), id = g.createImageData(540, 960);
    for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (R() - .5) * 200; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    g.putImageData(id, 0, 0); GR.push(c);
  }
  VIG = mk(W, H); { const g = VIG.getContext('2d'); const gr = g.createRadialGradient(W / 2, H * .48, H * .28, W / 2, H / 2, H * .78); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.72)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  // crimson glove leather
  LEA = mk(1500, 2500); {
    const g = LEA.getContext('2d'); const gr = g.createLinearGradient(0, 0, 1500, 2500);
    gr.addColorStop(0, '#9c0c17'); gr.addColorStop(.5, '#7a0711'); gr.addColorStop(1, '#4a030a');
    g.fillStyle = gr; g.fillRect(0, 0, 1500, 2500);
    for (let i = 0; i < 26000; i++) { const x = R() * 1500, y = R() * 2500, r = 1 + R() * 3.2; g.fillStyle = R() < .5 ? 'rgba(0,0,0,.16)' : 'rgba(255,140,130,.07)'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
    const sh = g.createRadialGradient(500, 700, 50, 600, 900, 1100); sh.addColorStop(0, 'rgba(255,120,110,.28)'); sh.addColorStop(1, 'rgba(255,120,110,0)'); g.fillStyle = sh; g.fillRect(0, 0, 1500, 2500);
    g.setLineDash([22, 16]); g.lineWidth = 5; g.strokeStyle = 'rgba(255,235,220,.42)';
    [[210, 240], [2290, 2260]].forEach(([a, b]) => { g.beginPath(); g.moveTo(0, a); g.bezierCurveTo(500, a + 60, 1000, b - 60, 1500, b); g.stroke(); g.beginPath(); g.moveTo(0, a + 40); g.bezierCurveTo(500, a + 100, 1000, b - 20, 1500, b + 40); g.stroke(); });
  }
  // ring canvas floor (top-down)
  CANV = mk(1500, 2500); {
    const g = CANV.getContext('2d'); g.fillStyle = '#d6d0c5'; g.fillRect(0, 0, 1500, 2500);
    for (let i = 0; i < 30000; i++) { g.fillStyle = R() < .5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.08)'; g.fillRect(R() * 1500, R() * 2500, 2 + R() * 4, 1 + R() * 2); }
    g.lineWidth = 46; g.strokeStyle = 'rgba(160,20,30,.16)'; g.beginPath(); g.arc(750, 1250, 560, 0, 7); g.stroke();
    g.lineWidth = 10; g.strokeStyle = 'rgba(0,0,0,.07)'; g.beginPath(); g.arc(750, 1250, 470, 0, 7); g.stroke();
    for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(120,10,20,.05)'; g.beginPath(); g.arc(R() * 1500, R() * 2500, 10 + R() * 50, 0, 7); g.fill(); }
  }
  for (let i = 0; i < 90; i++) DUST.push({ x: (R() - .5) * 1800, y: (R() - .5) * 2600, z: -300 + R() * 640, r: .8 + R() * 2.6, v: 8 + R() * 22, ph: R() * 6.28 });
  for (let i = 0; i < 14; i++) BOK.push({ x: R() * W, y: 80 + R() * 700, r: 30 + R() * 90, a: .05 + R() * .12 });
  for (let i = 0; i < 120; i++) CONF.push({ x: R() * W, y0: -200 - R() * 1800, v: 380 + R() * 420, w: 8 + R() * 14, h: 16 + R() * 20, rs: (R() - .5) * 10, ph: R() * 6.28, sw: 20 + R() * 50, c: R() < .7 ? '#f4c04a' : (R() < .5 ? '#fff2c0' : '#d0141f') });
  for (let i = 0; i < 60; i++) FLASHES.push({ x: R() * W, y: 200 + R() * 1600, t: R() * 1.6, s: .5 + R() });
}
function dust(g, t, rgb, a, camx = 0, camy = 0) {
  for (const p of DUST) {
    const zf = 920 / (920 - p.z);
    const yy = ((p.y - t * p.v - camy) % 2600 + 2600) % 2600 - 1300;
    const x = W / 2 + (p.x - camx) * zf + Math.sin(t * .7 + p.ph) * 10, y = H / 2 + yy * zf;
    g.globalAlpha = a * (0.4 + 0.6 * cl((p.z + 300) / 640));
    g.fillStyle = `rgb(${rgb})`; g.beginPath(); g.arc(x, y, p.r * zf, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}
function bokeh(g, rgb, a, dx = 0) {
  for (const b of BOK) glow(g, b.x + dx, b.y, b.r, rgb, b.a * a);
}
function spotlight(g, x, topY, floorY, wTop, wBot, a, rgb = '255,244,226') {
  if (a <= 0) return;
  const gr = g.createLinearGradient(0, topY, 0, floorY);
  gr.addColorStop(0, `rgba(${rgb},${.42 * a})`); gr.addColorStop(1, `rgba(${rgb},${.06 * a})`);
  g.fillStyle = gr; g.beginPath(); g.moveTo(x - wTop / 2, topY); g.lineTo(x + wTop / 2, topY); g.lineTo(x + wBot / 2, floorY); g.lineTo(x - wBot / 2, floorY); g.closePath(); g.fill();
  g.save(); g.translate(x, floorY); g.scale(1, .2); glow(g, 0, 0, wBot * .62, rgb, .55 * a); g.restore();
}

/* ---------- global impacts (shake / zoom punch / flash) ---------- */
// [time, shake, flash]
const IMP = [[0.03, .25, .05], [2.135, .55, .22], [3.426, .25, 0], [5.80, .28, 0], [6.23, .28, 0], [6.44, .3, 0], [6.66, .32, 0], [6.87, .5, .12],

/* ---------- seam transforms ---------- */
function seamXf(sh, t) {
  let x = 0, y = 0, s = 1, a = 1;
  if (sh.en && t < sh.t0 + sh.en[1]) {
    const u = cl((t - sh.t0) / sh.en[1]), e = 1 - p4o(u);
    a = Math.min(a, .35 + .65 * cl(u / .45));
    switch (sh.en[0]) {
      case 'left': x += 230 * e; break; case 'up': y += 260 * e; break; case 'down': y -= 260 * e; break;
      case 'push': s *= logz(.8, 1, p4o(u)); break; case 'pull': s *= logz(1.28, 1, p4o(u)); break;
    }
  }
  if (sh.ex && t > sh.t1 - sh.ex[1]) {
    const u = cl((t - (sh.t1 - sh.ex[1])) / sh.ex[1]), e = p4i(u);
    a = Math.min(a, 1 - .8 * cl(u / .85));
    switch (sh.ex[0]) {
      case 'left': x -= 230 * e; break; case 'up': y -= 260 * e; break; case 'down': y += 260 * e; break;
      case 'push': s *= logz(1, 1.25, e); break; case 'pull': s *= logz(1, .78, e); break;
    }

  return { x, y, s, a };
}
function drawXf(g, src, q, alpha) {
  g.save(); g.globalAlpha = alpha; g.translate(W / 2 + q.x, H / 2 + q.y); g.scale(q.s, q.s); g.drawImage(src, -W / 2, -H / 2); g.restore();
}

/* ---------- frame ---------- */

  }

}
function post(t, bl, flash) {
